plugins { id 'com.android.application' }

android {
    namespace 'com.globalcity.engine'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.globalcity.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
    }

    externalNativeBuild {
        cmake {
            path file('../../engine/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; debuggable false }
    }
}
