name: Native engine validation

on:
  push:
    branches: [global-engine-0.1-native]
    paths:
      - "engine/**"
      - ".github/workflows/native-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/native-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B build-engine -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-engine --parallel 2
      - name: Test
        run: ctest --test-dir build-engine --output-on-failure
