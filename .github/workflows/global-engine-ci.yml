name: GLOBAL ENGINE validation

on:
  push:
    paths:
      - 'engine/**'
      - 'android/**'
      - '.github/workflows/global-engine-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'android/**'
      - '.github/workflows/global-engine-ci.yml'
  workflow_dispatch:

jobs:
  core-tests:
    name: C++17 core build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B build-engine -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-engine --parallel 2
      - name: Test
        run: ctest --test-dir build-engine --output-on-failure

  android-debug:
    name: Android arm64 debug APK compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
