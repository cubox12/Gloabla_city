name: GLOBAL CITY validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local textures
        run: python tools/generate_textures.py
      - name: Validate source and assets
        run: |
          python tools/validate_project.py
          python -m py_compile tools/generate_textures.py tools/validate_project.py

  godot-import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local textures
        run: python tools/generate_textures.py
      - name: Download Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: "$GODOT_BIN --headless --editor --path . --quit"
      - name: Run main scene
        run: "$GODOT_BIN --headless --path . --quit-after 5"
