name: GLOBAL CITY validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate local textures
        run: python3 tools/generate_textures.py
      - name: Validate source and assets
        run: |
          python3 tools/validate_project.py
          python3 -m py_compile tools/generate_textures.py tools/validate_project.py

  godot-import-check:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate local textures
        run: python3 tools/generate_textures.py
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run main scene
        run: timeout 20s godot --headless --path . --quit-after 5
