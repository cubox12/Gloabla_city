name: GLOBAL CITY-BETA 0.1 validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local textures
        run: python tools/generate_textures.py
      - name: Validate source and assets
        run: |
          python tools/validate_project.py
          python -m py_compile tools/generate_textures.py tools/validate_project.py

  godot-import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local textures
        run: python tools/generate_textures.py
      - name: Download Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: "$GODOT_BIN --headless --editor --path . --quit"
      - name: Run main scene
        run: "$GODOT_BIN --headless --path . --quit-after 5"

  core-tests:
    name: GLOBAL ENGINE C++17 core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native engine core
        run: cmake -S engine -B build-engine -DCMAKE_BUILD_TYPE=Release
      - name: Build native engine core
        run: cmake --build build-engine --parallel 2
      - name: Test native engine core
        run: ctest --test-dir build-engine --output-on-failure --verbose

  android-debug:
    name: GLOBAL CITY-BETA 0.1 Android arm64/x86_64 APK compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components (retry transient NDK downloads)
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; then
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Android SDK download failed on attempt $attempt; retrying..." >&2
            sleep 10
          done
          exit 1
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile native Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify packaged native entry points and app identity
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p /tmp/global-city-beta-apk
          unzip -q "$APK" -d /tmp/global-city-beta-apk
          NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for ABI in arm64-v8a x86_64; do
            LIB="/tmp/global-city-beta-apk/lib/$ABI/libglobalengine.so"
            test -s "$LIB"
            "$NM" -D --defined-only "$LIB" | grep -Eq '[[:space:]]ANativeActivity_onCreate$'
            "$NM" -D --defined-only "$LIB" | grep -Eq '[[:space:]]android_main$'
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='0.1'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'GLOBAL CITY-BETA'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and check rendered frame on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            test -s "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell monkey -p com.globalcity.app 1
            sleep 6
            adb shell pidof com.globalcity.app
            adb logcat -d -s GlobalEngine:V AndroidRuntime:E > /tmp/global-city-beta-log.txt
            grep -F "GLOBAL CITY-BETA 0.1 native entry point reached" /tmp/global-city-beta-log.txt
            grep -F "GLES ready:" /tmp/global-city-beta-log.txt
            grep -E "Directional shadow map ready|Directional shadows disabled before framebuffer|Shadow map framebuffer unavailable|Directional shadows inactive" /tmp/global-city-beta-log.txt
            adb exec-out screencap -p > /tmp/global-city-beta-screen.png
            python -m pip install --quiet pillow
            python -c 'from PIL import Image; im=Image.open("/tmp/global-city-beta-screen.png").convert("RGB"); w,h=im.size; p=list(im.crop((w//4,h//4,3*w//4,3*h//4)).getdata()); ratio=sum(1 for c in p if max(c)>20)/len(p); print(f"non-black center pixels: {ratio:.1%}"); assert ratio>0.05, "rendered frame is nearly black"'
      
      - name: Upload native debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-city-beta-0.1-arm64-x86_64-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
