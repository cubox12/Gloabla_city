name: GLOBAL CITY-BETA 0.1 validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local textures
        run: python tools/generate_textures.py
      - name: Validate source and assets
        run: |
          python tools/validate_project.py
          python -m py_compile tools/generate_textures.py tools/validate_project.py

  godot-import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local textures
        run: python tools/generate_textures.py
      - name: Download Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: "$GODOT_BIN --headless --editor --path . --quit"
      - name: Run main scene
        run: "$GODOT_BIN --headless --path . --quit-after 5"

  core-tests:
    name: GLOBAL ENGINE C++17 core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native engine core
        run: cmake -S engine -B build-engine -DCMAKE_BUILD_TYPE=Release
      - name: Build native engine core
        run: cmake --build build-engine --parallel 2
      - name: Test native engine core
        run: ctest --test-dir build-engine --output-on-failure --verbose

  android-debug:
    name: GLOBAL CITY-BETA 0.1 Android arm64 APK compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: android-actions/setup-ndk@v3
        with:
          ndk-version: 27.2.12479018
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile native Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify packaged native entry points and app identity
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p /tmp/global-city-beta-apk
          unzip -q "$APK" -d /tmp/global-city-beta-apk
          LIB="/tmp/global-city-beta-apk/lib/arm64-v8a/libglobalengine.so"
          test -s "$LIB"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only "$LIB" | grep -Eq '[[:space:]]ANativeActivity_onCreate$'
          "$NM" -D --defined-only "$LIB" | grep -Eq '[[:space:]]android_main$'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='0.1'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-label:'GLOBAL CITY-BETA'"
      - name: Upload native debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-city-beta-0.1-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
